				"$(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/blueutil",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Copy Homebrew helper CLIs next to ORBITMac so the sandbox can execute them; re-sign for the app identity.\nset -e\nfor TOOL in blueutil brightness nightlight; do\n  DEST=\"${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/${TOOL}\"\n  SRC=\"\"\n  for C in /opt/homebrew/bin/${TOOL} /usr/local/bin/${TOOL}; do\n    if [ -x \"$C\" ]; then SRC=\"$C\"; break; fi\n  done\n  if [ -n \"$SRC\" ]; then\n    cp -f \"$SRC\" \"$DEST\"\n    chmod +x \"$DEST\"\n    codesign --force --sign - \"$DEST\" 2>/dev/null || true\n    echo \"[ORBITMac] Copied ${TOOL} from $SRC\"\n  else\n    echo \"[ORBITMac] ${TOOL} not found at Homebrew paths (optional)\"\n  fi\ndone";
		};
